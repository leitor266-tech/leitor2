<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Abrir Site</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    text-align:center;
}

h2{
    font-size:24px;
    margin:10px 0 25px;
}

input{
    width:100%;
    height:45px;
    font-size:18px;
    padding:5px 10px;
    background:#fff;
    color:#000;
    border:0;
}

button{
    width:100%;
    height:45px;
    margin-top:12px;
    font-size:20px;
    background:#1e88e5;
    color:#fff;
    border:0;
}

.limpar{
    background:#444;
    margin-top:8px;
}

.info{
    margin-top:25px;
    font-size:14px;
    color:#aaa;
}
</style>

</head>

<body>

<h2>ABRIR HTML</h2>

<input 
id="url" 
type="text" 
placeholder="Cole o endereço do site HTML">

<button onclick="abrir()">
ABRIR
</button>

<button class="limpar" onclick="limpar()">
NOVO ENDEREÇO
</button>

<div class="info">
Último endereço fica salvo neste navegador.
</div>


<script>

var campo = document.getElementById("url");

// Carrega último endereço salvo
campo.value = localStorage.getItem("ultimoHTML") || "";


function abrir(){

    var endereco = campo.value.trim();

    if(endereco === ""){
        return;
    }

    localStorage.setItem("ultimoHTML", endereco);

    // Abre somente o endereço escolhido
    window.location.replace(endereco);
}


function limpar(){

    localStorage.removeItem("ultimoHTML");

    campo.value = "";

}

</script>

</body>
</html>
