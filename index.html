<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cinema Online</title>

<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#111;
color:#fff;
}

header{
background:#000;
color:#ff0000;
padding:15px;
font-size:28px;
font-weight:bold;
text-align:center;
}

.layout{

display:flex;

height:calc(100vh - 70px);

overflow:hidden;

}

/* MENU LATERAL */

.menuLateral{

width:240px;

background:#0d0d0d;

padding:15px;

overflow-y:auto;

border-right:1px solid #222;

}

/* BOTÕES DO MENU */

.menuItem{

padding:14px;

margin-bottom:8px;

border-radius:8px;

background:#1a1a1a;

cursor:pointer;

font-size:18px;

transition:.2s;

}

/* ITEM SELECIONADO */

.menuItem.active{

background:#0078ff;

font-weight:bold;

}

.menuItem.focus{

outline:4px solid #00bfff;

background:#006eff;

transform:scale(1.05);

}

/* QUANDO PASSAR O FOCO */

.menuItem:hover{

background:#0060d0;

}

/* ÁREA DA DIREITA */

.conteudo{

flex:1;

display:flex;

flex-direction:column;

overflow:hidden;

}

/* PLAYER */

.player{

padding:15px;

background:#000;

}

/* PLAYER PEQUENO */

.player video{

width:100%;

max-height:320px;

background:#000;

border-radius:10px;

}

/* IFRAME */

.player iframe{

width:100%;

height:320px;

display:none;

border-radius:10px;

}

/* LISTA */

.grid{

flex:1;

overflow-y:auto;

display:grid;

grid-template-columns:repeat(auto-fill,minmax(220px,1fr));

gap:18px;

padding:20px;

}

video{

width:100%;
border-radius:10px;

}

iframe{

width:100%;
height:700px;
border:none;
border-radius:10px;
display:none;

}

.card{

background:#1b1b1b;

border-radius:10px;

overflow:hidden;

cursor:pointer;

transition:.2s;

border:3px solid transparent;

}

.card:hover{

transform:scale(1.04);

border-color:#0078ff;

}

.card.focus{

outline:5px solid #00bfff;

transform:scale(1.08);

z-index:5;

}

.card img{

width:100%;

height:300px;

object-fit:cover;

}

.card h3{

padding:12px;

font-size:18px;

text-align:center;

font-weight:bold;

}

@media(max-width:1200px){

.grid{
grid-template-columns:repeat(4,1fr);
}

}

@media(max-width:900px){

.grid{
grid-template-columns:repeat(3,1fr);
}

}

@media(max-width:600px){

.grid{
grid-template-columns:repeat(2,1fr);
}

.card img{

height:220px;

}

}

::-webkit-scrollbar{

width:10px;

}

::-webkit-scrollbar-thumb{

background:#444;

border-radius:10px;

}

::-webkit-scrollbar-track{

background:#111;

}

</style>

</head>

<body>

<header>

🎬 Cinema Online

</header>

<div class="layout">

    <div class="menuLateral">

        <div class="menuItem active" data-cat="todos">Todos</div>

        <div class="menuItem" data-cat="canais">Canais</div>

        <div class="menuItem" data-cat="lancamento">Lançamentos</div>

        <div class="menuItem" data-cat="ficcao">Ficção</div>

        <div class="menuItem" data-cat="series">Séries</div>

        <div class="menuItem" data-cat="esportes">Esportes</div>

        <div class="menuItem" data-cat="infantil">Infantil</div>

        <div class="menuItem" data-cat="documentarios">Documentários</div>

        <div class="menuItem" data-cat="musica">Música</div>

        <div class="menuItem" data-cat="comedia">Comédia</div>

        <div class="menuItem" data-cat="anime">Anime</div>

        <div class="menuItem" data-cat="religioso">Religioso</div>

        <div class="menuItem" data-cat="dorama">Dorama</div>

        <div class="menuItem" data-cat="suspense">Suspense</div>

        <button id="atualizarLista">

            Atualizar Lista

        </button>

    </div>

    <div class="conteudo">

        <div class="player">

            <video
                id="videoPlayer"
                playsinline
                controls
                preload="metadata"
                style="display:none;">
            </video>

            <iframe
                id="iframePlayer"
                allowfullscreen
                allow="autoplay; fullscreen">
            </iframe>

        </div>

        <div class="grid" id="gridFilmes">

        </div>

    </div>

</div>

</div>

<script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.2/dist/hls.min.js"></script>

<script>

const enderecoRAW="https://raw.githubusercontent.com/Isac-Arqueiro/mylist/master/canais.m3u";

const player=new Plyr('#videoPlayer',{

fullscreen:{enabled:true},

controls:[
'play-large',
'play',
'progress',
'current-time',
'mute',
'volume',
'settings',
'pip',
'airplay',
'fullscreen'
]

});

let hls;

function trocar(url){

    const video = document.getElementById("videoPlayer");
    const iframe = document.getElementById("iframePlayer");

    // Fecha iframe
    iframe.style.display = "none";
    iframe.src = "";

    video.style.display = "block";

    // Destroi player anterior
    if(hls){
        hls.destroy();
        hls = null;
    }

    // Se for M3U8
    if(url.endsWith(".m3u8")){

        if(Hls.isSupported()){

            hls = new Hls({
                enableWorker:true,
                lowLatencyMode:true
            });

            hls.loadSource(url);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED,function(){
                video.play();
            });

            hls.on(Hls.Events.ERROR,function(event,data){
                console.log(data);
            });

        }else if(video.canPlayType("application/vnd.apple.mpegurl")){

            video.src = url;
            video.play();

        }

        return;
    }

    // MP4
    video.src = url;
    video.load();
    video.play();

}


async function carregarFilmes() {

    try {

        const resposta = await fetch(enderecoRAW + "?v=" + Date.now());

        const texto = await resposta.text();

        let lista = [];

        // JSON
        if (texto.trim().startsWith("[")) {

            lista = JSON.parse(texto);

        }

        // M3U
        else if (texto.includes("#EXTM3U")) {

            lista = converterM3U(texto);

        }

        const grid = document.getElementById("gridFilmes");

        grid.innerHTML = "";

        lista.forEach(f => {

            grid.innerHTML += `

<div

class="card ${f.categoria.toLowerCase()}"

data-video="${f.video}"

data-categoria="${f.categoria.toLowerCase()}"

>

<img src="${f.imagem}">

<h3>${f.titulo}</h3>

</div>

`;

        });

        ligarEventosCards();

        filtrarCategoria();

    } catch (e) {

        console.log(e);

        alert("Erro ao carregar lista.");

    }

}

function ligarEventosCards(){

    document.querySelectorAll(".card").forEach(card=>{

        card.onclick=function(){

            trocar(this.dataset.video);

        }

    });

}

function converterM3U(m3u) {

    const linhas = m3u.split("\n");

    const lista = [];

    let titulo = "";
    let imagem = "";
    let categoria = "";

    for (let i = 0; i < linhas.length; i++) {

        const linha = linhas[i].trim();

        if (linha.startsWith("#EXTINF")) {

            const nome = linha.match(/,(.*)$/);

            titulo = nome ? nome[1] : "Sem título";

            const logo = linha.match(/tvg-logo="([^"]*)"/);

            imagem = logo && logo[1] !== ""
                ? logo[1]
                : "https://via.placeholder.com/300x450?text=SEM+CAPA";

            const grupo = linha.match(/group-title="([^"]*)"/);

            categoria = grupo
                ? grupo[1]
                    .replace("C •", "")
                    .trim()
                    .toLowerCase()
                : "canais";

        }

        else if (
            linha.startsWith("http://") ||
            linha.startsWith("https://")
        ) {

            lista.push({

                titulo,

                imagem,

                video: linha,

                categoria

            });

        }

    }

    return lista;

}

window.onload=function(){

carregarFilmes();

}

document.getElementById("atualizarLista").onclick=function(){

carregarFilmes();

};

</script>
<script>

// ==============================
// MENU LATERAL
// ==============================

let categoriaAtual = "todos";

const menu = document.querySelectorAll(".menuItem");

menu.forEach(item=>{

    item.onclick=function(){

        menu.forEach(m=>m.classList.remove("active"));

        this.classList.add("active");

        categoriaAtual=this.dataset.cat;

        filtrarCategoria();

    }

});

function filtrarCategoria(){

    const cards=document.querySelectorAll(".card");

    cards.forEach(card=>{

        if(categoriaAtual=="todos"){

            card.style.display="block";

        }

        else if(card.classList.contains(categoriaAtual)){

            card.style.display="block";

        }

        else{

            card.style.display="none";

        }

    });

    focoLista=0;

    atualizarFocoLista();

}

// ==================================
// CONTROLE REMOTO TV
// ==================================


let areaFoco = "menu";

let focoMenu = 0;

let focoLista = 0;



function pegarMenu(){

    return [...document.querySelectorAll(".menuItem")];

}



function pegarLista(){

    return [...document.querySelectorAll(".card")]
    .filter(c=>c.style.display!="none");

}



function atualizarFocoRemoto(){


    document.querySelectorAll(".menuItem")
    .forEach(item=>{

        item.classList.remove("focus");

    });



    document.querySelectorAll(".card")
    .forEach(item=>{

        item.classList.remove("focus");

    });



    if(areaFoco=="menu"){


        let menu=pegarMenu();


        if(menu[focoMenu]){


            menu[focoMenu].classList.add("focus");


            menu[focoMenu]
            .scrollIntoView({

                block:"center"

            });


        }


    }



    else{


        let lista=pegarLista();


        if(lista[focoLista]){


            lista[focoLista]
            .classList.add("focus");


            lista[focoLista]
            .scrollIntoView({

                block:"center"

            });


        }


    }


}



document.addEventListener("keydown",function(e){


let tecla=e.key;



let menu=pegarMenu();

let lista=pegarLista();



switch(tecla){



case "ArrowDown":


if(areaFoco=="menu"){


focoMenu++;


if(focoMenu>=menu.length)

focoMenu=menu.length-1;


}


else{


focoLista++;


if(focoLista>=lista.length)

focoLista=lista.length-1;


}



atualizarFocoRemoto();


break;





case "ArrowUp":


if(areaFoco=="menu"){


focoMenu--;


if(focoMenu<0)

focoMenu=0;


}


else{


focoLista--;


if(focoLista<0)

focoLista=0;


}



atualizarFocoRemoto();


break;





case "ArrowRight":


if(areaFoco=="menu"){


areaFoco="lista";


focoLista=0;


}


atualizarFocoRemoto();


break;





case "ArrowLeft":


if(areaFoco=="lista"){


areaFoco="menu";


}


atualizarFocoRemoto();


break;





case "Enter":



if(areaFoco=="menu"){


menu[focoMenu].click();


areaFoco="lista";


focoLista=0;


}


else{


if(lista[focoLista]){


lista[focoLista].click();


}


}



atualizarFocoRemoto();


break;




case "Escape":


history.back();


break;



}



});


</script>

<button id="btnInstall">📲 Instalar App</button>

<script>
let deferredPrompt;

const btnInstall = document.getElementById("btnInstall");

// Verifica se já está instalado
function isAppInstalled() {
  return window.matchMedia('(display-mode: standalone)').matches
    || window.navigator.standalone === true;
}

// Se não estiver instalado
if (!isAppInstalled()) {

  window.addEventListener("beforeinstallprompt", (e) => {

    e.preventDefault();

    deferredPrompt = e;

    btnInstall.style.display = "block";
  });

}

// Clique no botão
btnInstall.addEventListener("click", async () => {

  if (!deferredPrompt) return;

  deferredPrompt.prompt();

  const { outcome } = await deferredPrompt.userChoice;

  console.log("Resultado:", outcome);

  deferredPrompt = null;

  btnInstall.style.display = "none";
});

// Quando instalar
window.addEventListener("appinstalled", () => {

  console.log("PWA instalado");

  btnInstall.style.display = "none";
});

// Registrar Service Worker
if ("serviceWorker" in navigator) {

  navigator.serviceWorker.register("./service-worker.js")
    .then(() => console.log("SW registrado"))
    .catch((err) => console.log("Erro SW:", err));

}
</script>
